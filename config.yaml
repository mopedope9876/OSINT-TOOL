# ============================================================
# OSINT Tool — Configuration File
# ============================================================
# You can edit this file directly, or manage API keys through
# the ⚙ Settings button in the GUI — it saves them safely to
# your OS config folder so they never touch this file.

general:
  output_dir: "reports"
  default_format: "json"
  request_timeout: 10

logging:
  level: "INFO"
  write_to_file: true
  log_file: "logs/osint.log"

plugins:
  # All plugins listed. Comment a line with # to disable it.
  enabled:
    # ── No API key needed ──────────────────────────────────
    - ipapi          # IP geolocation (ip-api.com)
    - ipinfo         # IP geolocation & ASN (ipinfo.io)
    - github_user    # GitHub public profile
    - whois_lookup   # WHOIS domain/IP registration data
    - dns_lookup     # DNS records (A/MX/NS/TXT/CNAME/SOA)
    - gravatar       # Email → public Gravatar profile
    - crtsh          # Subdomain discovery via cert transparency
    - phone_info     # Offline phone number analysis

    # ── Free API key required ──────────────────────────────
    # Get these via the ⚙ Settings screen in the GUI,
    # or set the environment variables below.
    - shodan         # Open ports & services  (shodan.io)
    - virustotal     # Threat intel            (virustotal.com)
    - abuseipdb      # IP reputation          (abuseipdb.com)
    - urlscan        # Domain scan history    (urlscan.io)

  # ── Per-plugin options ──────────────────────────────────

  ipapi:
    base_url: "http://ip-api.com/json"

  github_user:
    base_url: "https://api.github.com/users"
    # Optional GitHub token for higher rate limits (still free):
    # api_key: "${GITHUB_TOKEN}"

  shodan:
    # Free key at: https://account.shodan.io/register
    api_key: "${SHODAN_API_KEY}"

  virustotal:
    # Free key at: https://www.virustotal.com/gui/join-us
    api_key: "${VIRUSTOTAL_API_KEY}"

  abuseipdb:
    # Free key at: https://www.abuseipdb.com/register
    api_key: "${ABUSEIPDB_API_KEY}"

  urlscan:
    # Free key at: https://urlscan.io/user/signup
    api_key: "${URLSCAN_API_KEY}"

rate_limiting:
  delay_between_requests: 0
