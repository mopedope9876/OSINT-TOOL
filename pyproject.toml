[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "osint-tool"
version = "0.1.0"
description = "Modular OSINT aggregation tool — query multiple public sources from one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["osint", "security", "reconnaissance", "cli"]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "python-whois>=0.9.0",
    "dnspython>=2.4.0",
]

[project.scripts]
osint-tool = "osint.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["osint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
